<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Job Application Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style id="pf-style">
/* Layout: the portfolio opens like a bio-data file. A sticky tab strip is the index; each tab is one sheet with ruled rows, mono tenure stamps and a photo set against an offset frame. The developer screens reuse the same sheet language with form fields. */
:root{
  --bg:#EEF1F6;--surface:#FFFFFF;--sunken:#E6EBF3;--ink:#0C1A2B;--ink-2:#37475B;--muted:#5B697D;
  --line:#D2DAE6;--accent:#1F46E0;--accent-ink:#FFFFFF;--accent-soft:#E2E8FD;
  --mark:#FFD84A;--mark-ink:#1A1400;--good:#0E7A55;--bad:#B42318;--bad-soft:#FDE7E5;
  --warn-soft:#FFF3C6;--warn-ink:#5A4300;--shadow:0 10px 28px -14px rgba(12,26,43,.28);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09111D;--surface:#101C2E;--sunken:#0B1524;--ink:#E7EDF6;--ink-2:#B7C4D6;--muted:#8A99AF;
    --line:#21314A;--accent:#86A0FF;--accent-ink:#09111D;--accent-soft:#18274D;
    --mark:#6B5600;--mark-ink:#FFF1BF;--good:#4CC9A0;--bad:#FF8F85;--bad-soft:#3B1A1A;
    --warn-soft:#3A3011;--warn-ink:#FFE08A;--shadow:0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09111D;--surface:#101C2E;--sunken:#0B1524;--ink:#E7EDF6;--ink-2:#B7C4D6;--muted:#8A99AF;
  --line:#21314A;--accent:#86A0FF;--accent-ink:#09111D;--accent-soft:#18274D;
  --mark:#6B5600;--mark-ink:#FFF1BF;--good:#4CC9A0;--bad:#FF8F85;--bad-soft:#3B1A1A;
  --warn-soft:#3A3011;--warn-ink:#FFE08A;--shadow:0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ol{margin:0}
ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:inline-grid;place-items:center;line-height:0;flex:none}
.stack{display:grid;gap:16px;min-width:0}
.stack-s{display:grid;gap:12px;min-width:0}

/* header + tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;height:56px}
.mono-mark{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;cursor:pointer;font:700 14px var(--f-display);letter-spacing:.02em;background:var(--ink);color:var(--surface);border-radius:3px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--f-body);padding:10px 12px;border-radius:3px;cursor:pointer;position:relative;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--accent)}
.icon-btn{appearance:none;width:36px;height:36px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer;transition:background .15s,border-color .15s}
.icon-btn:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn.small{width:30px;height:30px}
.icon-btn.armed{width:auto;padding:0 10px;background:var(--bad);border-color:var(--bad);color:var(--surface);font:600 13px var(--f-body)}

/* page + section head */
.page{padding-block:28px 56px;min-width:0}
.view{animation:rise .28s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.sec-head h1{font:600 clamp(28px,6vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.meta{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini-h{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.lead{font-size:clamp(17px,2.4vw,20px);color:var(--ink-2);max-width:60ch}
.banner{margin-bottom:20px;padding:10px 14px;border-radius:3px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);text-align:center}

/* buttons, chips */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--f-body);padding:11px 16px;border-radius:3px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:7px 11px;font-size:13px}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.file-btn{position:relative;overflow:hidden}
.fin{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer;z-index:2}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter{appearance:none;font:500 14px var(--f-body);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.filter:hover{border-color:var(--accent)}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* home */
.hero{display:grid;gap:32px;align-items:center}
@media (min-width:780px){.hero{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:56px}}
.hero-text{display:grid;gap:14px;justify-items:start;min-width:0}
.pos-line{line-height:1.2}
.position{font:600 clamp(18px,3.4vw,24px)/1.5 var(--f-display);background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;overflow-wrap:anywhere}
.hero h1{font:700 clamp(40px,9vw,84px)/.95 var(--f-display);letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.photo{position:relative;justify-self:start;width:min(60vw,236px);aspect-ratio:4/5;margin-right:12px}
@media (min-width:780px){.photo{justify-self:end;width:min(100%,320px)}}
.photo::before{content:"";position:absolute;inset:12px -12px -12px 12px;border:2px solid var(--accent);border-radius:3px;pointer-events:none}
.frame{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:var(--sunken);display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.initials{font:700 72px var(--f-display);color:var(--muted);letter-spacing:-.02em}
.home-grid{display:grid;gap:36px;margin-top:52px}
@media (min-width:780px){.home-grid{grid-template-columns:1fr 1fr;gap:56px}}
.glance{border-top:1px solid var(--line)}
.glance-row{appearance:none;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 6px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer;font:500 17px var(--f-display);transition:background .15s}
.glance-row:hover{background:var(--accent-soft)}
.glance-row .count{font:500 14px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.glance-row .ic{transition:transform .15s}
.glance-row:hover .ic{transform:translateX(4px)}

/* bio-data sheet */
.sheet{display:grid}
.row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);transition:background .15s}
.row:hover{background:var(--accent-soft)}
.row dt{flex:none;max-width:46%;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.leader{flex:1;min-width:10px;border-bottom:1px dotted var(--muted);opacity:.55;transform:translateY(-4px)}
.row dd{min-width:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.objective{margin-bottom:28px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.objective p{color:var(--ink-2);max-width:70ch}

/* timeline */
.timeline{display:grid}
.tl-item{position:relative;padding:0 0 22px 26px;margin-left:6px;border-left:2px solid var(--line)}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-8px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:grid;gap:4px;justify-items:start;transition:box-shadow .2s,transform .2s}
.tl-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stamp{font:500 13px var(--f-mono);color:var(--accent);letter-spacing:.02em}
.tl-card h2{font:600 clamp(20px,3.4vw,26px)/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.role{font:500 17px var(--f-display);color:var(--ink-2)}
.honor{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 13px var(--f-body);color:var(--warn-ink);background:var(--warn-soft);padding:4px 10px;border-radius:3px}
.span{margin-bottom:28px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.span h2{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.span-row,.axis{display:grid;grid-template-columns:minmax(80px,28%) 1fr;gap:10px;align-items:center}
.span-row{padding:5px 0}
.span-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--sunken);border-radius:2px}
.fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px;transform-origin:left;animation:grow .6s ease both}
@keyframes grow{from{transform:scaleX(0)}}
.ticks{position:relative;height:20px;margin-top:4px;font:400 11px var(--f-mono);color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}

/* skills */
.skill-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.skill{background:var(--surface);border:1px solid var(--line);padding:14px 16px;border-radius:4px;display:grid;gap:10px;align-content:start;transition:box-shadow .2s,transform .2s}
.skill:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.skill-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.skill h3{font:600 18px/1.25 var(--f-display);overflow-wrap:anywhere}
.type{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.meter i{height:8px;background:var(--sunken);border-radius:1px}
.meter i.on{background:var(--accent);animation:fill .35s calc(var(--i)*70ms) both}
@keyframes fill{from{background:var(--sunken)}}
.level{font:500 13px var(--f-mono);color:var(--ink-2)}

/* projects */
.proj-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.proj{appearance:none;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.proj:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cover{aspect-ratio:16/10;background:var(--sunken);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.proj:hover .cover img{transform:scale(1.04)}
.proj .body{padding:14px 16px 16px;display:grid;gap:6px}
.proj h3{font:600 20px/1.2 var(--f-display)}
.proj p{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{font:500 12px var(--f-mono);color:var(--accent)}
.vid-tile{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:6px;background:linear-gradient(135deg,#16233a,#0b1220);color:#fff}
.play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.vt{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}

/* modal */
.scrim{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(6,12,22,.76);padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{position:relative;background:var(--surface);color:var(--ink);width:min(960px,100%);max-height:100%;overflow:auto;border-radius:6px;min-width:0;animation:rise .22s ease both}
.modal .x{position:absolute;top:10px;right:10px;z-index:3}
.stage-wrap{position:relative;background:#05090f}
.stage{display:grid;place-items:center;min-height:200px}
.stage img,.stage video{display:block;max-width:100%;max-height:62vh;object-fit:contain}
.no-media{display:grid;gap:8px;justify-items:center;padding:48px 16px;color:#cbd5e1;text-align:center}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.nav-btn.prev{left:10px}.nav-btn.next{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 0}
.thumb{appearance:none;flex:none;width:62px;height:62px;border-radius:3px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--sunken);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--accent)}
.m-body{padding:16px 20px 22px;display:grid;gap:8px}
.m-body h2{font:600 clamp(22px,4vw,30px)/1.15 var(--f-display);letter-spacing:-.01em}
.m-body p{color:var(--ink-2);white-space:pre-line;max-width:70ch}

/* reference + contact */
.ref-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:12px;align-content:start;transition:box-shadow .2s,transform .2s}
.ref:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ref h2{font:600 22px/1.2 var(--f-display);overflow-wrap:anywhere}
.kv{display:grid;gap:2px;padding-top:10px;border-top:1px solid var(--line)}
.kv dt{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{display:flex;justify-content:space-between;align-items:center;gap:8px;overflow-wrap:anywhere;user-select:text}
.contact-list{display:grid;gap:0;margin:22px 0;border-top:2px solid var(--ink)}
.contact-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 4px;border-bottom:1px solid var(--line);transition:background .15s}
.contact-row:hover{background:var(--accent-soft)}
.contact-row>div{min-width:0}
.contact-val{font:600 clamp(20px,4.6vw,30px)/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere;user-select:text;margin-top:2px}
.foot{touch-action:manipulation;border-top:1px solid var(--line);color:var(--muted);font:400 13px var(--f-mono)}
.foot .wrap{padding-block:20px}
.seal{cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* gateway */
.gate{display:grid;place-items:center;padding:48px 0}
.gate-card{width:min(420px,100%)}
.gate-card h1{font:600 30px/1.1 var(--f-display);letter-spacing:-.02em}
.pw-row{display:flex;gap:8px}
.msg{min-height:1.4em;font-size:14px;color:var(--bad)}
.msg.ok{color:var(--good)}

/* developer */
.devbar{background:var(--ink);color:var(--bg)}
.devbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.devtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tagline{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);padding:3px 8px;border-radius:2px}
.devnote{font-size:13px;opacity:.8}
.devactions{display:flex;gap:8px}
.devbar .btn{background:transparent;color:inherit;border-color:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-title{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:6px}
.f{display:grid;gap:6px;min-width:0}
.f>span{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;min-width:0;font:400 16px var(--f-body);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.in:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.in:disabled{opacity:.5}
textarea.in{resize:vertical;min-height:90px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.photo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-prev{width:112px;aspect-ratio:4/5;background:var(--sunken);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:grid;place-items:center}
.photo-prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-prev .initials{font-size:36px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mthumb{position:relative;aspect-ratio:1;background:var(--sunken);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}

function spanChart(items){
  const rows = items.map(x => ({name:x.company || 'Untitled', t:tenureInfo(x)})).filter(r => r.t.ok);

  const min = Math.min.apply(null, rows.map(r => r.t.a));
  const max = Math.max.apply(null, rows.map(r => r.t.b));
  const span = Math.max(1, max - min);
  const step = span <= 8 ? 1 : span <= 16 ? 2 : 5;
  const ticks = [];
  for (let y = min; y <= max; y += step) ticks.push(y);
  if (ticks[ticks.length - 1] !== max) {
    if (max - ticks[ticks.length - 1] < step / 2) ticks[ticks.length - 1] = max; else ticks.push(max);
  }
  return el('section', {class:'span', 'aria-label':'Career timeline chart'},
    el('h2', {text:'Career span, ' + min + ' to ' + max}),

      el('div', {class:'track'}, el('div', {class:'fill', style:'left:' + ((r.t.a - min) / span * 100) + '%;width:' + Math.max((r.t.b - r.t.a) / span * 100, 2.5) + '%'})))),

function dataUriToBlobUrl(uri){
  try {
    const i = uri.indexOf(',');
    const mime = uri.slice(5, i).split(';')[0];
    const bin = atob(uri.slice(i + 1));
    const bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    return URL.createObjectURL(new Blob([bytes], {type:mime}));
  } catch (e) { return ''; }
}

async function tryUnlock(value){
  if (Date.now() < lockUntil) return {ok:false, locked:true};
  await remoteReady;
  let ok = false;
  if (remote) {
    try {
      const r = await fetch(API + '?action=verify', {method:'POST', headers:{'x-dev-password':encodeURIComponent(value)}});
      if (r.ok) ok = true;
      else if (r.status === 429) return {ok:false, locked:true};
      else if (r.status !== 401) return {ok:false, unsupported:true};
    } catch (e) { return {ok:false, unsupported:true}; }
  } else {
    try { ok = await verifyPassword(value, state.auth); } catch (e) { return {ok:false, unsupported:true}; }
  }
  if (ok) { devPw = value; sset('pf.pw', value); fails = 0; return {ok:true}; }
  fails++;
  if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; return {ok:false, locked:true}; }
  return {ok:false};
}
function renderGate(){

    busy = true;
    go.disabled = true;
    msg.textContent = 'Checking…';
    let r;
    try { r = await tryUnlock(pw.value); } catch (err) { r = {ok:false, unsupported:true}; }
    busy = false;
    go.disabled = false;
    if (r.ok) { sset('pf.dev', String(Date.now())); enterDev(); return; }
    pw.value = '';
    msg.textContent = r.unsupported ? 'This browser cannot check the password on this page.' : r.locked ? 'Too many attempts. Wait 30 seconds and try again.' : 'Incorrect password.';
    pw.focus();
  }
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); attempt(); } });

    el('div', {class:'eyebrow', text:'Restricted'}),

async function readAsDataUrl(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
}
async function imageToDataUrl(file, o){
  o = o || {};
  const max = o.max || 1400;
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) {
    const url = URL.createObjectURL(file);
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    URL.revokeObjectURL(url);
  }
  const w = bmp.width, h = bmp.height;
  let sx = 0, sy = 0, sw = w, sh = h, dw, dh;
  if (o.crop) {
    if (w / h > o.crop) sw = h * o.crop; else sh = w / o.crop;
    sx = (w - sw) / 2; sy = (h - sh) / 2;
    dw = Math.min(max, Math.round(sw)); dh = Math.round(dw / o.crop);
  } else {
    const sc = Math.min(1, max / Math.max(w, h));
    dw = Math.round(w * sc); dh = Math.round(h * sc);
  }
  const c = document.createElement('canvas');
  c.width = dw; c.height = dh;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, dw, dh);
  g.drawImage(bmp, sx, sy, sw, sh, 0, 0, dw, dh);
  return c.toDataURL('image/jpeg', o.quality || 0.82);
}

function mediaManager(pr, idp){
  const grid = el('div', {class:'media-grid'});
  const status = el('p', {class:'hint', role:'status'});
  function draw(){
    grid.replaceChildren(...pr.media.map((m, i) => el('div', {class:'mthumb'},
      m.type === 'video' ? videoTile() : el('img', {src:m.src, alt:'Uploaded photo ' + (i + 1)}),
      el('button', {class:'mrm', type:'button', 'aria-label':'Remove this file', onClick:() => { pr.media.splice(i, 1); markDirty(); draw(); updateSize(); }}, icon('close', 14)),
      m.external ? el('span', {class:'ext', text:'Large file'}) : null)));
    if (!pr.media.length) grid.replaceChildren(el('p', {class:'hint', text:'No photos or videos yet.'}));
    const ext = pr.media.some(m => m.external);
    status.textContent = '';
  }
  draw();
  async function addPhotos(files){
    for (let k = 0; k < files.length; k++) {
      if (pr.media.length >= 12) { toast('Each project can hold up to 12 files.'); break; }
      status.textContent = 'Adding photo ' + (k + 1) + ' of ' + files.length + '…';
      try {
        let u = await imageToDataUrl(files[k], {max:1400, quality:0.82});
        if (remote) u = await uploadMedia(dataUrlToBlob(u), 'image/jpeg');
        pr.media.push({id:uid(), type:'image', src:u, name:files[k].name});
      } catch (e) { toast(remote ? 'A photo could not be uploaded. Check your connection and try again.' : 'One image could not be read. Try a JPG or PNG photo.'); }
    }
    markDirty(); draw(); updateSize();
  }
  async function addVideo(file){
    if (pr.media.length >= 12) { toast('Each project can hold up to 12 files.'); return; }
    if (!/^video\/(mp4|webm)$/.test(file.type)) { toast('Use an MP4 or WebM video. Most phones can save videos as MP4.'); return; }
    if (remote) {
      if (file.size > 5 * 1048576) { toast('Videos must be under 5 MB. Trim the clip or lower its quality.'); return; }
      status.textContent = 'Uploading video…';
      try { pr.media.push({id:uid(), type:'video', src:await uploadMedia(file, file.type), name:file.name}); }
      catch (e) { toast('The video could not be uploaded. Try a smaller file.'); }
    } else if (file.size <= EMBED_VIDEO_MAX) {
      status.textContent = 'Adding video…';
      try { pr.media.push({id:uid(), type:'video', src:await readAsDataUrl(file), name:file.name}); }
      catch (e) { toast('That video could not be read.'); }
    } else {
      toast('Videos over 7 MB cannot be added here. Trim the clip to under 7 MB.');
    }
    status.textContent = '';
    markDirty(); draw(); updateSize();
  }
  return el('div', {class:'stack-s'},
    el('span', {class:'item-title', text:'Photo or video proof'}),
    grid,
    el('div', {class:'btn-row'},
      fileBtn({label:'Add photos', accept:'image/*', multiple:true, icon:'image', small:true, onFiles:addPhotos}),
      fileBtn({label:'Add video', accept:'video/mp4,video/webm,video/*', icon:'video', small:true, onFiles:fs => addVideo(fs[0])})),
    status);
}

function editSecurity(){
  const cur = el('input', {class:'in', id:'sec-cur', type:'password', autocomplete:'current-password'});
  const nw = el('input', {class:'in', id:'sec-new', type:'password', autocomplete:'new-password'});
  const cf = el('input', {class:'in', id:'sec-cf', type:'password', autocomplete:'new-password'});
  const msg = el('p', {class:'msg', role:'status'});
  const say = (t, ok) => { msg.textContent = t; msg.className = 'msg' + (ok ? ' ok' : ''); };
  const btn = el('button', {class:'btn primary', type:'button'}, 'Update password');
  async function changePw(){
    say('');
    btn.disabled = true;
    try {
      if (nw.value.length < 8) { say('Use at least 8 characters for the new password.'); return; }
      if (nw.value !== cf.value) { say('The new passwords do not match.'); return; }
      if (remote) {
        const r = await fetch(API + '?action=password', {method:'POST', headers:{'x-dev-password':encodeURIComponent(cur.value), 'content-type':'application/json'}, body:JSON.stringify({password:nw.value})});
        if (r.status === 401) { say('Current password is incorrect.'); return; }
        if (!r.ok) { say('Could not update the password. Try again.'); return; }
        devPw = nw.value; sset('pf.pw', devPw);
        cur.value = nw.value = cf.value = '';
        say('Password changed. It is active now.', true);
        return;
      }
      if (!(await verifyPassword(cur.value, draft.auth))) { say('Current password is incorrect.'); return; }
      const salt = bytesToHex(randomBytes(16));
      draft.auth = {salt, iter:150000, hash:await derive(nw.value, salt, 150000)};
      cur.value = nw.value = cf.value = '';
      markDirty();
      say('Password updated. Press Download updated file to apply it.', true);
    } catch (err) { say('Could not update the password. Try again.'); }
    finally { btn.disabled = false; }
  }
  btn.addEventListener('click', changePw);
  const form = el('div', {class:'card'},
    el('strong', {class:'item-title', text:'Change developer password'}),
    el('label', {class:'f', 'for':'sec-cur'}, el('span', {text:'Current password'}), cur),
    el('label', {class:'f', 'for':'sec-new'}, el('span', {text:'New password'}), nw),
    el('label', {class:'f', 'for':'sec-cf'}, el('span', {text:'Confirm new password'}), cf),
    msg, el('div', {}, btn));
  return el('div', {class:'stack'}, form,
    el('div', {class:'card'},
      el('strong', {class:'item-title', text:'How to open this screen'}),
      el('p', {class:'hint', text:'There is no link to this screen on the portfolio. Add #developer to the end of your portfolio link, or tap the footer text at the very bottom of any page five times quickly. Either one opens the password gateway.'}),
      el('p', {class:'hint', text:remote ? 'The password is checked on the server and is never shown on the page. Changes go live when you press Save changes, and only someone with the password can save.' : 'The password is stored only as a salted hash and is never shown on the page. Saving to the website is not connected here, so changes only go live when you upload the downloaded file.'})));
}

function buildDocument(data){
  const style = document.getElementById('pf-style').textContent;
  const script = document.getElementById('pf-app').textContent;
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  let reset = FALLBACK_RESET;
  try {
    const s = document.head.querySelector('style');
    if (s && /safe-area-inset/.test(s.textContent) && /\[hidden\]/.test(s.textContent)) reset = s.textContent;
  } catch (e) {}
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>'
    + TOP + '<style id="pf-style">' + style + '</style><div id="pf-root"></div>'
    + '<script type="application/json" id="pf-data">' + json + '</' + 'script>'
    + '<script id="pf-app">' + script + '</' + 'script></body></html>';
}
async function save(){
  if (saving) return;
  const next = clone(draft);
  next.sample = false;
  if (remote) {
    delete next.auth;
    saving = true; updateSaveBar();
    try {
      const r = await fetch(API + '?action=save', {method:'POST', headers:authHeaders({'content-type':'application/json'}), body:JSON.stringify({data:next})});
      if (r.status === 401) toast('Your login expired. Log out and unlock the developer view again.');
      else if (r.status === 413) toast('Too much text to save. Shorten some descriptions.');
      else if (!r.ok) toast('Could not save. Try again in a moment.');
      else {
        state = normalize(Object.assign(clone(next), {auth:{}}));
        draft = clone(state);
        dirty = false;
        clearDraft();
        toast('Saved. Your changes are live.');
      }
    } catch (e) { toast('Could not reach the server. Your edits are still kept on this device.'); }
    saving = false; updateSaveBar(); updateNotice(); updateSize();
    return;
  }
  const doc = buildDocument(next);
  if (doc.length > LIMIT + 700000) { toast('The page is too large to save. Remove or shrink some photos and videos.'); return; }
  try {
    const url = URL.createObjectURL(new Blob([doc], {type:'text/html'}));
    const a = el('a', {href:url, download:'index.html'});
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    state = normalize(next);
    draft = clone(state);
    dirty = false; clearDraft();
    updateNotice(); updateSaveBar();
    toast('Downloaded index.html. Upload it to your website to publish these changes.');
  } catch (e) { toast('Could not create the file. Try again.'); }
}

function enterDev(){

/* ---------- boot ---------- */
function render(){
  $root.replaceChildren();
  if (mode === 'gate') $root.append(renderGate());
  else if (mode === 'dev' && draft) {
    if (devPreview) $root.append(renderSite(draft, {preview:true}), previewBar());

    updateNotice(); updateSaveBar(); updateSize();

const savedTheme = lget('pf.theme');
if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
try {
  const h = (location.hash || '').slice(1);
  if (VIEWS[h]) siteView = h;
} catch (e) {}
window.addEventListener('hashchange', () => { try { if (location.hash === '#developer') openGate(); } catch (e) {} });
document.addEventListener('keydown', e => { if (e.altKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) openGate(); });
let hashGate = false;
try { hashGate = location.hash === '#developer'; } catch (e) {}
if (hashGate) mode = 'gate';
render();
remoteReady.then(() => {
  if (devAuthed() && (!remote || devPw)) enterDev();
  else if (mode === 'site') render();
});
if (sget('pf.just') === '1') { sset('pf.just', null); toast('Saved. Your changes are now live.'); }
})();
